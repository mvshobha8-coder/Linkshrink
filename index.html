    <!-- GitHub Pages Single-Page Application 404 recovery script -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.search.indexOf('p=') > -1) {
          var params = new URLSearchParams(l.search);
          var path = params.get('p');
          if (path) {
            window.history.replaceState(null, null, '/' + path + l.hash);
          }
        }
      }(window.location))
    </script>
